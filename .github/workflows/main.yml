name: "*** build ipa/tipa file ***"

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    needs: [uikit-layout, port-tests]
    if: always() && needs.port-tests.result == 'success' && (needs.uikit-layout.result == 'success' || needs.uikit-layout.result == 'skipped')
    runs-on: macos-latest
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@main
        with:
            fetch-depth: 0
            submodules: recursive

      - name: Set up Node for RC9 port checks
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          cd $BASEDIR

      - name: Build and Install trustcache
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Set Environment Variables
        run: |
          set -x
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "${T2}" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "ctimestamp=${TS}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: Build
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          plutil -insert items.4 -xml "<dict><key>cell</key><string>PSGroupCell</string><key>label</key><string>BUILDER</string></dict>" ./Application/Dopamine/UI/Settings/Credits.plist
          plutil -insert items.5 -xml "<dict><key>cell</key><string>PSGroupCell</string><key>headerCellClass</key><string>DOCreditsCell</string><key>names</key><array><dict><key>name</key><string>${{ github.actor }}</string><key>link</key><string>https://github.com/${{ github.repository }}</string></dict></array></dict>" ./Application/Dopamine/UI/Settings/Credits.plist
          gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1
          APP_VERSION="$(cat ./BaseBin/_external/basebin/.version)-$(cat ./BaseBin/_external/basebin/.version-roothide)"
          installer="DopamineGlass-RH-${shorthash}"
          for ext in ipa tipa; do
            mv "Application/Dopamine-roothide-${APP_VERSION}.${ext}" "Application/${installer}.${ext}"
          done
          echo "installer=${installer}" >> "$GITHUB_ENV"

      - name: Verify packaged RC9 identity and keychain scope
        shell: bash
        run: |
          set -euo pipefail
          tipa="Application/${installer}.tipa"
          python3 scripts/package-sileo-only.py --verify "$tipa"
          cmp "$tipa" "${tipa%.tipa}.ipa"
          unzip -p "$tipa" Payload/Dopamine.app/Dopamine > "$RUNNER_TEMP/RootHide-Dopamine"
          unzip -p "$tipa" Payload/Dopamine.app/Info.plist > "$RUNNER_TEMP/RootHide-Info.plist"
          unzip -p "$tipa" Payload/Dopamine.app/Themes.plist > "$RUNNER_TEMP/RootHide-Themes.plist"
          ldid -e "$RUNNER_TEMP/RootHide-Dopamine" > app-entitlements.plist
          plutil -convert json -o app-entitlements.json app-entitlements.plist
          plutil -convert json -o app-info.json "$RUNNER_TEMP/RootHide-Info.plist"
          plutil -lint "$RUNNER_TEMP/RootHide-Themes.plist"
          node scripts/verify-app-entitlements.cjs app-entitlements.json app-info.json
          for locale in en zh-CN zh-Hans zh-Hant zh-HK zh-TW; do
            strings="$RUNNER_TEMP/RootHide-$locale-Localizable.strings"
            unzip -p "$tipa" "Payload/Dopamine.app/$locale.lproj/Localizable.strings" > "$strings"
            plutil -lint "$strings"
          done
          unzip -p "$tipa" Payload/Dopamine.app/basebin.tar > "$RUNNER_TEMP/RootHide-basebin.tar"
          tar -tf "$RUNNER_TEMP/RootHide-basebin.tar" | grep -E '(^|/)roothidehooks\.dylib$'
          tar -xOf "$RUNNER_TEMP/RootHide-basebin.tar" basebin/.version-roothide > "$RUNNER_TEMP/RootHide-runtime-version"
          cmp BaseBin/_external/basebin/.version-roothide "$RUNNER_TEMP/RootHide-runtime-version"
          expected="$(cat BaseBin/_external/basebin/.version)-$(cat BaseBin/_external/basebin/.version-roothide)"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$RUNNER_TEMP/RootHide-Info.plist")" = "$expected"

      - name: Upload Artifact
        id: dopamine-latest-upload
        uses: actions/upload-artifact@main
        with:
          name: ${{ env.installer }}.ipa
          path: Application/${{ env.installer }}.ipa
          archive: false

      - name: Upload Artifact(TIPA)
        id: dopamine-latest-upload-tipa
        uses: actions/upload-artifact@main
        with:
          name: ${{ env.installer }}.tipa
          path: Application/${{ env.installer }}.tipa
          archive: false

  port-tests:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify glass, authorization and upstream boundaries
        run: node scripts/run-rc9-tests.cjs
      - name: Verify installer resource customization
        run: python3 tests/glass-app-archive.test.py

  uikit-layout:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify UIKit table geometry and layering
        env:
          DORH_RUN_UIKIT_SIMULATOR: '1'
          DORH_SIMULATOR_RUNTIME: '18.5'
        run: node --test --test-name-pattern='UIKit simulator exercises' tests/glass-ui-contracts.test.cjs
      - name: Upload UIKit layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UIKit_layout_evidence
          path: .audit-artifacts/preferences-ui/
          include-hidden-files: true
          if-no-files-found: ignore
